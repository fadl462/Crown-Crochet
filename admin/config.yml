backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPOSITORY
  branch: main
  base_url: https://YOUR-OAUTH-PROVIDER.example.com
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - file: "content/site.yml"
        label: "Site Settings"
        name: "settings"
        fields:
          - {label: "Salon Name", name: "salon_name", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "WhatsApp", name: "whatsapp", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Instagram", name: "instagram", widget: "string", required: false}
          - {label: "Facebook", name: "facebook", widget: "string", required: false}
          - {label: "TikTok", name: "tiktok", widget: "string", required: false}
  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    fields:
      - {label: "Service Name", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Starting Price", name: "price", widget: "string", required: false}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    fields:
      - {label: "Client Name", name: "name", widget: "string"}
      - {label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5}
      - {label: "Review", name: "review", widget: "text"}
